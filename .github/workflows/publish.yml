name: Test & Publish

on:
  workflow_dispatch:

jobs:
  publish:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - name: Validate manifest version, channel and immutable tag
        id: release
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: node scripts/release-metadata.mjs github >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (src)
        run: pnpm run lint:check
      - name: Run tests
        run: pnpm test
      - name: Build
        run: pnpm run build
      - name: Pack dry run
        run: pnpm pack --dry-run
      - name: Publish to npm
        env:
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: npm publish --access public --provenance --tag "$CHANNEL"
      - name: Create and push immutable git tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
          PREPARED_TAG: ${{ steps.release.outputs.preparedTag }}
        run: |
          if [[ "$PREPARED_TAG" != true ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
          fi
          git push origin "$TAG"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          FLAGS=(--latest)
          if [[ "$PRERELEASE" == true ]]; then
            FLAGS=(--prerelease --latest=false)
          elif [[ "$CHANNEL" == v2 ]]; then
            FLAGS=(--latest=false)
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes "${FLAGS[@]}"
