name: CI

on:
  pull_request:
    branches:
      - main
      - release/v2
      - release/v3

jobs:
  ci:
    name: Test, Build & Dry-run Release (Node ${{ matrix.node }})
    strategy:
      matrix:
        node: ['22.14.0', '22']
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (src)
        run: pnpm run lint:check

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Pack dry-run (verify bundle)
        run: pnpm pack --dry-run
